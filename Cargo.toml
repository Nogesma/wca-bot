[package]
name = "wca-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
cynic = { version = "3.12.0", features = ["http-reqwest"] }
dotenv = "0.15.0"
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.28"
poise = "0.6.1"
reqwest = { version = "0.12.24", features = ["blocking"] }
serde = "1.0.228"
serde_json = "1.0.145"
serenity = { version = "0.12.4", features = ["cache", "http", "model"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-cron-scheduler = "0.15.1"

[build-dependencies]
cynic-codegen = "3.12.0"
