[package]
name = "wca-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", default-features = false }
cynic = { version = "3.12.0", features = ["http-reqwest"] }
dotenv = "0.15.0"
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
futures = { version = "0.3.31", default-features = false }
log = "0.4.28"
reqwest = "0.12.24"
serde = "1.0.228"
serde_json = "1.0.145"
serenity = { version = "0.12.4", default-features = false, features = ["cache", "http", "model", "rustls_backend", "client", "gateway"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt-multi-thread"] }
tokio-cron-scheduler = "0.15.1"

[build-dependencies]
cynic-codegen = "3.12.0"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
